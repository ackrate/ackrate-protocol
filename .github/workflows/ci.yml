name: ci

# Rust contract gates are owned by ackrate-protocol-contracts.

on:
  push:
  pull_request:

jobs:
  contract:
    # Preserve the required status while testing the contract in its owning repo.
    name: mandate-registry (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract-source/contracts/legacy-protocol/mandate-registry
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ackrate/ackrate-protocol-contracts
          ref: 02b673d1bb678e19c2c40e6afe7ccf75c61b6d65
          path: contract-source
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
      - run: cargo +1.98.0 fmt --all -- --check
      - run: cargo +1.98.0 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.98.0 test --locked

  packages:
    name: workspaces (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm ci
      - name: dependency advisory gate (release stop on high or critical)
        run: npm audit --audit-level=high
      - name: Complete repository gate check
        run: npm run verify
      - name: Candidate package clean-room gate check
        run: npm run gatecheck:release
