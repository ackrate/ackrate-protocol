name: ci

# The §10 negative suite runs on every push from commit one — a Stellar
# directive. It must never be "added at the end".

on:
  push:
  pull_request:

jobs:
  contract:
    name: mandate-registry (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/mandate-registry
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo test (incl. negative suite)
        run: cargo test

  packages:
    name: workspaces (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm ci
      - name: dependency advisory gate (release stop on high or critical)
        run: npm audit --audit-level=high
      - name: Complete repository gate check
        run: npm run verify
      - name: Candidate package clean-room gate check
        run: npm run gatecheck:release
